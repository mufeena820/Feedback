<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f5e6d3, #d2a679, #8b5e3c);
        margin: 0;
        padding: 40px 20px;
        min-height: 100vh;
    }

    h1 {
        text-align: center;
        color: #4b2e1f;
        font-size: 32px;
    }

    p {
        text-align: center;
        color: #6f4e37;
        font-size: 17px;
    }

    form {
        max-width: 500px;
        margin: 30px auto;
        background: linear-gradient(145deg, #fffaf3, #f3dfc5);
        padding: 30px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(75, 46, 31, 0.25);
        display: flex;
        flex-direction: column;
        gap: 12px;
        border: 1px solid #c49a6c;
    }

    label {
        color: #4b2e1f;
        font-weight: bold;
    }

    input, select, textarea {
        padding: 12px;
        font-size: 15px;
        border: 1px solid #bc9675;
        border-radius: 8px;
        background-color: #fffdf9;
        outline: none;
    }

    input:focus, select:focus, textarea:focus {
        border-color: #6f4e37;
        box-shadow: 0 0 6px rgba(111, 78, 55, 0.3);
    }

    button {
        background: linear-gradient(135deg, #8b5e3c, #4b2e1f);
        color: white;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: linear-gradient(135deg, #4b2e1f, #2d1b12);
        transform: translateY(-2px);
    }
</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Website</title>
</head>
<body>

    <h1>Student Feedback Form</h1>
    <p>We value your feedback!</p>

    <form id="feedbackForm">

        <label>Student Name:</label>
        <input type="text" name="studentName" placeholder="Enter your name" required>

        <label>Department:</label>
        <select name="department" required>
            <option value="">Select Department</option>
            <option>BCA</option>
            <option>B.Sc Computer Science</option>
            <option>B.Com</option>
            <option>BA</option>
        </select>

        <label>Feedback Category:</label>
        <select name="category" required>
            <option value="">Select Category</option>
            <option>Teaching & Faculty</option>
            <option>Classroom & Infrastructure</option>
            <option>Library Facilities</option>
            <option>Canteen Facilities</option>
        </select>

        <label>Rating:</label>
        <select name="rating" required>
            <option value="">Select Rating</option>
            <option>Excellent</option>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>
        </select>

        <label>Your Feedback:</label>
        <textarea name="message" placeholder="Write your feedback here" required></textarea>

        <button type="submit">Submit Feedback</button>

    </form>

    <p id="status"></p>

    <script>
        const form = document.getElementById('feedbackForm');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch('/feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                document.getElementById('status').textContent = result.message;

                if (response.ok) {
                    form.reset();
                }

            } catch (error) {
                document.getElementById('status').textContent =
                    'Something went wrong!';
            }
        });
    </script>

</body>
</html>
